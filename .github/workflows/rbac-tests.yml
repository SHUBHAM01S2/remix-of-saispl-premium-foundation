name: E2E & API tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  rbac-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: http://localhost:8080
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TEST_CLIENT_EMAIL: ${{ secrets.TEST_CLIENT_EMAIL }}
      TEST_CLIENT_PASSWORD: ${{ secrets.TEST_CLIENT_PASSWORD }}
      TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
      TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
      TEST_ADMIN_USER_ID: ${{ secrets.TEST_ADMIN_USER_ID }}
      TEST_PARTNER_EMAIL: ${{ secrets.TEST_PARTNER_EMAIL }}
      TEST_PARTNER_PASSWORD: ${{ secrets.TEST_PARTNER_PASSWORD }}
      TEST_PARTNER_ID: ${{ secrets.TEST_PARTNER_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Build
        run: bun run build

      - name: Start preview server
        run: |
          bun run start &
          for i in {1..30}; do
            curl -sSf "$BASE_URL" > /dev/null && break
            sleep 2
          done

      - name: Run API RBAC tests
        run: bunx vitest run tests/api/

      - name: Run E2E RBAC tests
        run: bunx playwright test tests/e2e/admin-access.spec.ts tests/e2e/admin-demotion.spec.ts

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
