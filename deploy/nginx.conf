# ─────────────────────────────────────────────────────────────────────────────
# SAISPL — Nginx config for shivaryaninfotech.com (VPS + PM2 + TanStack Start)
#
# Goals:
#   1. Gzip + Brotli compression for JS/CSS/HTML/JSON/SVG/fonts
#   2. Permanent 301 redirects for canonical URL (http→https, www→apex)
#   3. No redirect chains: one hop max from any variant to canonical https://shivaryaninfotech.com
#   4. Long-lived immutable caching for hashed build assets
#
# Deploy:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/shivaryaninfotech.com
#   sudo ln -sf /etc/nginx/sites-available/shivaryaninfotech.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Brotli requires the module: `sudo apt install libnginx-mod-brotli` (Ubuntu 22.04+)
# If brotli isn't installed, comment the `brotli*` lines — gzip alone still works.
# ─────────────────────────────────────────────────────────────────────────────

# --- 1) Canonical redirect: http (any host) → https apex, ONE hop ------------
server {
    listen 80;
    listen [::]:80;
    server_name shivaryaninfotech.com www.shivaryaninfotech.com;

    # ACME challenge for certbot renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://shivaryaninfotech.com$request_uri;
    }
}

# --- 2) https www → https apex, ONE hop --------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.shivaryaninfotech.com;

    ssl_certificate     /etc/letsencrypt/live/shivaryaninfotech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shivaryaninfotech.com/privkey.pem;

    return 301 https://shivaryaninfotech.com$request_uri;
}

# --- 3) Canonical origin: https://shivaryaninfotech.com ----------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shivaryaninfotech.com;

    ssl_certificate     /etc/letsencrypt/live/shivaryaninfotech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shivaryaninfotech.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security + SEO headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        application/ld+json
        application/manifest+json
        application/wasm
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # ── Brotli (requires libnginx-mod-brotli) ─────────────────────────────────
    brotli on;
    brotli_comp_level 5;
    brotli_static on;
    brotli_min_length 1024;
    brotli_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/ld+json
        application/manifest+json
        application/wasm
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # ── Static hashed build assets: long-cache immutable ─────────────────────
    # TanStack Start / Nitro emits fingerprinted files under /_build and /assets.
    location ~* ^/(_build|assets)/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # ── Common static file extensions from /public ───────────────────────────
    location ~* \.(?:css|js|mjs|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|avif|ico|map)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;

        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    # ── App (SSR via PM2 → Nitro node-server on :3000) ────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # No trailing-slash redirects: TanStack routes are declared without them,
    # so requests already hit canonical paths — avoids extra 301 hops.
}
